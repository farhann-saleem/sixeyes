              "@type": "ContactPoint",
              "telephone": "+92-300-4084760",

          },
          {
            "@type": "WebSite",
            "@id": "https://www.marketingstudioie.site/#website",
            "url": "https://www.marketingstudioie.site",
            "name": "Marketing Studio",
            "publisher": {
              "@id": "https://www.marketingstudioie.site/#organization"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.marketingstudioie.site/#application",
            "name": "Marketing Studio",
            "applicationCategory": "MultimediaApplication",

          {
            "@type": "FAQPage",
            "@id": "https://www.marketingstudioie.site/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do I turn a script into an AI documentary video with an editable timeline?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Marketing Studio (https://www.marketingstudioie.site) provides an end-to-end documentary video pipeline. Enter your topic or script to generate director-crafted scenes, preview and select AI footage for each scene, and edit the final sequence with voiceover narration and audio mixing on an interactive in-browser timeline."
                }
              },
              {
                "@type": "Question",
                "name": "How does Marketing Studio differ from single-prompt AI video generators?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Unlike tools that only generate isolated 5-second video clips from single prompts, Marketing Studio provides a cohesive multi-scene workflow: script drafting, scene-by-scene shot comparison, character avatar continuity, voiceover generation, and a multi-track timeline video editor."
                }
              },
              {
                "@type": "Question",
                "name": "Can I connect AI coding assistants like Claude or Cursor to Marketing Studio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Marketing Studio includes a native Model Context Protocol (MCP) server at https://www.marketingstudioie.site/mcp that enables Claude Desktop, Cursor, and Windsurf to draft scripts, query stock footage, and assemble projects programmatically."
                }
              }
            ]
          }
        ]
      }
